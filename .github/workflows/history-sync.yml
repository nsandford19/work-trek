name: History sync

# Refreshes the committed work-history ledgers in reports/history/ from GitHub — weekly
# and on demand — and lands any change as a PR, never a direct push to main.
#
# Why FULL regeneration instead of a past-N-months window: merged PRs and closed issues
# are frozen facts, so regenerating everything converges on identical content, self-heals
# late edits anywhere in history (label changes, title fixes, reopened issues), and costs
# only a few paginated list calls per repository per week. A windowed sync would need
# merge-by-key logic for a saving that does not matter at this volume.
#
# Landing strategy, deliberate:
#   - No force-push: SECURITY_POLICY.md gates force-pushes behind "ask", so each run
#     pushes a fresh dated branch instead. A still-open PR from a previous run is closed
#     as superseded — the new regeneration always contains everything the old one did.
#   - PRs created with github.token do NOT trigger the Validate workflow (GitHub
#     limitation), so validation runs here, before anything is pushed.
#
# Auth: reading OTHER repositories (e.g. example-org/infrastructure) requires the
# HISTORY_SYNC_TOKEN secret — a fine-grained PAT with read-only Contents, Issues and
# Pull requests on every covered repository. github.token only reaches this repo.
# The token's OWNER also defines whose work is ledgered: mc history sync records only
# PRs/issues by or assigned to the authenticated user, so this must be the operator's own PAT.
#
# Ledgers are data; narratives are judgement. If a merged refresh materially changed a
# period, update that period's narrative (reports/history/README.md rule 4).

on:
  schedule:
    # Weekly, Monday 05:47 UTC. Off the hour to avoid the GitHub cron thundering herd,
    # which delays or drops on-the-hour scheduled runs.
    - cron: '47 5 * * 1'
  workflow_dispatch:
    inputs:
      repo:
        description: 'owner/name to sync (this can also backfill a NEW repo); default refreshes every covered repo'
        required: false
        default: '--all'

permissions:
  contents: write        # push the chore/history-sync-* branch
  pull-requests: write   # open the update PR, close superseded ones

concurrency:
  group: history-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Refresh ledgers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pwsh is preinstalled on ubuntu-latest runners.
      #
      # continue-on-error, deliberately: mc syncs every repository it can and exits
      # non-zero naming the ones it could not. Failing the job here would skip the
      # landing step and throw away ledgers that refreshed perfectly well — one
      # repository's failure must not discard the rest. The run is failed at the
      # end instead, after landing.
      - name: Sync ledgers from GitHub
        id: sync
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.HISTORY_SYNC_TOKEN }}
          TARGET: ${{ github.event.inputs.repo || '--all' }}
        run: |
          if (-not $env:GH_TOKEN) {
            Write-Host '::error::HISTORY_SYNC_TOKEN secret is not set. Create a fine-grained PAT with read-only Contents/Issues/Pull requests on the covered repositories and add it as a repository secret.'
            exit 1
          }
          ./bin/mc.ps1 history sync $env:TARGET

      - name: Validate
        shell: pwsh
        run: ./bin/mc.ps1 validate

      - name: Land as a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- reports/history)" ]; then
            echo 'ledgers unchanged - nothing to land'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # A previous refresh still awaiting merge is fully contained in this one.
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("chore/history-sync-")) | .number' |
          while read -r num; do
            gh pr close "$num" --comment 'Superseded by a newer scheduled ledger refresh.' --delete-branch
          done

          branch="chore/history-sync-$(date -u +%Y%m%d-%H%M)"
          git switch -c "$branch"
          git add reports/history
          git commit -m "chore(history): ledger refresh $(date -u +%F)"
          git push -u origin "$branch"
          gh pr create --head "$branch" \
            --title 'chore(history): scheduled ledger refresh' \
            --body 'Generated by .github/workflows/history-sync.yml — regenerated work-history ledgers only. If a period changed materially, update its narrative per reports/history/README.md rule 4.'

      # Whatever synced has now landed. Report the repositories that did not, and fail:
      # nobody watches this weekly run, so a partial refresh must not look like a clean one.
      - name: Fail if any repository could not be synced
        if: steps.sync.outcome == 'failure'
        run: |
          echo '::error::One or more repositories could not be synced; ledgers for the rest were still refreshed. See the "Sync ledgers from GitHub" step for the per-repository reason.'
          exit 1
